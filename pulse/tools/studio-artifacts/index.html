<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phaeron · Studio · Artifacts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../design-system/tokens/colors.css">
<link rel="stylesheet" href="../../design-system/tokens/typography.css">
<link rel="stylesheet" href="../../design-system/tokens/spacing.css">
<link rel="stylesheet" href="../../design-system/tokens/effects.css">
<link rel="stylesheet" href="../../design-system/base.css">
<link rel="stylesheet" href="../../shared/module-subnav.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="pulse-react-chrome" data-title="Studio"></div>
<script src="/ui/islands/load-chrome.js"></script>

<div class="topbar" id="topbar">
  <div id="pulse-module-subnav" data-module="studio" data-view="artifacts" data-layout="inline"></div>
</div>

<div class="app" id="artifactsApp">

  <!-- ── LANDING ── -->
  <section class="landing" id="landingView">
    <div class="landing-center">
      <h1 class="landing-title">What should we create?</h1>
      <div class="create-box">
        <div class="composer">
          <textarea id="landingPrompt" rows="2" placeholder="Sketch a pipeline report, TLDR, or deck for the commercial team…" aria-label="Describe the artifact"></textarea>
          <div class="composer-bar">
            <div class="composer-left">
              <button type="button" class="icon-chip" id="attachBtn" aria-label="Attach file"><i data-lucide="plus"></i></button>
              <span class="ds-chip"><span class="ds-swatch" aria-hidden="true"></span>Phaeron Design System</span>
            </div>
            <div class="composer-right">
              <button type="button" class="send-btn" id="landingSend" aria-label="Create"><i data-lucide="arrow-up"></i></button>
            </div>
          </div>
        </div>
        <div class="tpl-section">
          <div class="tpl-label">Choose a template</div>
          <div class="tpl-strip" id="tplStrip" role="list"></div>
        </div>
      </div>
    </div>

    <div class="recent-panel">
      <div class="recent-head">
        <div class="recent-tabs" role="tablist">
          <button type="button" class="rtab active" data-tab="projects">Recent artifacts</button>
          <button type="button" class="rtab" data-tab="templates">Templates</button>
        </div>
        <div class="recent-tools">
          <label class="search-wrap">
            <i data-lucide="search"></i>
            <input type="search" id="recentSearch" placeholder="Search…" aria-label="Search artifacts" />
          </label>
        </div>
      </div>
      <div class="recent-list" id="recentList"></div>
    </div>
  </section>

  <!-- ── WORKSPACE ── -->
  <section class="workspace" id="workspaceView" hidden>
    <aside class="ws-chat">
      <div class="ws-chat-head">
        <button type="button" class="back-btn" id="backHome"><i data-lucide="arrow-left"></i>Artifacts</button>
        <span class="ws-tpl-pill" id="wsTplPill">Report</span>
      </div>
      <div class="ws-thread" id="wsThread"></div>
      <div class="ws-composer">
        <textarea id="wsPrompt" rows="2" placeholder="Refine the artifact…" aria-label="Message"></textarea>
        <button type="button" class="send-btn" id="wsSend" aria-label="Send"><i data-lucide="arrow-up"></i></button>
      </div>
    </aside>
    <main class="ws-canvas">
      <div class="ws-canvas-bar">
        <div class="ws-canvas-title" id="wsCanvasTitle">Artifact preview</div>
        <div class="ws-canvas-actions">
          <button type="button" class="rep-btn" id="expPdf"><i data-lucide="file-down"></i>Export</button>
          <button type="button" class="rep-btn" id="cpLink"><i data-lucide="link"></i>Copy link</button>
        </div>
      </div>
      <div class="ws-canvas-body" id="reportOutput">
        <div class="report-empty">
          <div class="re-ico"><i data-lucide="sparkles"></i></div>
          <p>Your artifact will appear here</p>
        </div>
      </div>
    </main>
  </section>
</div>

<div class="toast" id="toast"><i data-lucide="check-circle-2"></i><span id="toastMsg"></span></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script src="../../shared/module-subnav.js"></script>
<script src="../../favicon-pulse.js"></script>
<script src="./app.js"></script>
</body>
</html>
