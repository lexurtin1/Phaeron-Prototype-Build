<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Phaeron Layer 08B — front-end system tiles</title>
  <desc id="desc">Four isometric application tiles for market globe, executive dashboard, research insights and reporting packs, each attached to a straight pointer.</desc>
  <defs>
    <style>
      .edge{fill:#fff;stroke:#087fd0;stroke-width:1.25;stroke-linejoin:round}.side{fill:#f8fbfd;stroke:#087fd0;stroke-width:1}.line{fill:none;stroke:#087fd0;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}.soft{fill:none;stroke:#8fc8ef;stroke-width:1}.faint{fill:#dbeefb;stroke:#087fd0;stroke-width:.75}.ink{fill:#102538}.blue{fill:#087fd0}.red{fill:#c92146}.label{font:600 13px Arial,Helvetica,sans-serif;letter-spacing:.02em;fill:#102538}.micro{font:10px 'SFMono-Regular',Consolas,monospace;letter-spacing:.08em;fill:#62717e}.microblue{font:10px 'SFMono-Regular',Consolas,monospace;letter-spacing:.08em;fill:#087fd0}.pointer{fill:none;stroke:#087fd0;stroke-width:1.35;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#087fd0"/></marker>
    <symbol id="tile" overflow="visible">
      <path class="side" d="M-136 73 0 151 136 73v8L0 159-136 81Z"/>
      <path class="edge" d="M0 0 136 73 0 151-136 73Z"/>
      <path class="soft" d="M-119 73 0 9 119 73 0 141Z"/>
      <circle cx="-113" cy="70" r="2.5" class="red"/>
      <circle cx="-103" cy="65" r="2.5" class="faint"/>
    </symbol>
  </defs>
    <g id="market-globe" transform="translate(225 120)">
    <use href="#tile"/>
    <text class="label" x="0" y="-20" text-anchor="middle">MARKET GLOBE</text>
    <text class="micro" x="0" y="-5" text-anchor="middle">MARKETS / EVENTS / MOVEMENT</text>
    <ellipse cx="0" cy="74" rx="72" ry="42" class="line"/>
    <ellipse cx="0" cy="74" rx="28" ry="42" class="soft"/>
    <path class="soft" d="M-68 62h136M-70 76h140M-64 91h128M0 32v84"/>
    <path class="line" d="m-42 58 16-9 17 7 14-8 25 14 19-6M-31 85l18 10 16-8 18 9 21-12"/>
    <circle cx="31" cy="63" r="4" class="red"/><circle cx="-29" cy="83" r="3" class="blue"/>
  </g>
  <path class="pointer" d="M225 275L800 680"/>

  <g id="executive-dashboard" transform="translate(605 203)">
    <use href="#tile"/>
    <text class="label" x="0" y="-20" text-anchor="middle">EXECUTIVE DASHBOARD</text>
    <text class="micro" x="0" y="-5" text-anchor="middle">PERFORMANCE / EXPOSURE / PLAN</text>
    <path class="line" d="M-99 70-42 39 7 65-50 98ZM14 66l45-24 38 20-45 25ZM-29 103l45-24 43 23-45 24"/>
    <path class="soft" d="m-87 72 14-8 8 4 13-7 17 9 17-8M25 65l11-6 9 5 12-7 17 9M-16 103l9-5 8 4 12-6 17 8"/>
    <circle cx="57" cy="62" r="3.5" class="red"/>
  </g>
  <path class="pointer" d="M605 358L800 680"/>

  <g id="research-insights" transform="translate(985 120)">
    <use href="#tile"/>
    <text class="label" x="0" y="-20" text-anchor="middle">RESEARCH &amp; INSIGHTS</text>
    <text class="micro" x="0" y="-5" text-anchor="middle">BRIEFINGS / EVIDENCE / THEMES</text>
    <path class="line" d="m-92 56 42-23 95 51-42 24ZM-72 70 14 116M-52 59l86 46M-31 48l86 46"/>
    <path class="faint" d="m49 51 40 21-18 10-40-21Z"/>
    <path class="line" d="m45 60 9 5 7-4 12 6"/>
    <circle cx="62" cy="64" r="3" class="red"/>
  </g>
  <path class="pointer" d="M985 275L800 680"/>

  <g id="reporting-packs" transform="translate(1365 203)">
    <use href="#tile"/>
    <text class="label" x="0" y="-20" text-anchor="middle">REPORTING &amp; PACKS</text>
    <text class="micro" x="0" y="-5" text-anchor="middle">BOARD / CLIENT / REGULATORY</text>
    <path class="faint" d="m-83 63 67-36 95 51-67 37Z"/>
    <path class="edge" d="m-96 77 67-36 95 51-67 37Z"/>
    <path class="line" d="m-73 76 45-24M-58 84l45-24M-43 92 2 68M10 99l31-17"/>
    <path class="line" d="m15 58 20-11 26 14-20 11Z"/>
    <path class="red" d="m49 87 8 4-8 5-8-5Z"/>
  </g>
  <path class="pointer" d="M1365 358L800 680"/>
  <g id="hub-dock"><circle cx="800" cy="680" r="5" class="edge"/><circle cx="800" cy="680" r="2.2" class="red"/></g>
</svg>
