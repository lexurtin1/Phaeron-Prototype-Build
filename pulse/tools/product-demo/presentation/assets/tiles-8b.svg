<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Phaeron Layer 08B — executive surfaces</title>
  <desc id="desc">Four flat isometric executive panes: Market Globe, Executive Dashboard, Research &amp; Insights, and Reporting Packs.</desc>
  <defs>
    <style>
      .pane{fill:#fff;fill-opacity:.92;stroke:#087fd0;stroke-width:.95;stroke-linejoin:round}
      .line{fill:none;stroke:#087fd0;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}
      .soft{fill:none;stroke:#8fc8ef;stroke-width:.7;stroke-linecap:round;stroke-linejoin:round}
      .label{font:600 11px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;fill:#102538}
      .port{fill:#087fd0;fill-opacity:.35;stroke:none}
    </style>
    <symbol id="pane" overflow="visible">
      <path class="pane" d="M0 0 92 50 0 100 -92 50Z"/>
    </symbol>
  </defs>

  <!-- Upper band — port at (0,100) relative to translate -->
  <g id="market-globe" transform="translate(220 200)">
    <use href="#pane"/>
    <ellipse cx="0" cy="46" rx="30" ry="17" class="line"/>
    <ellipse cx="0" cy="46" rx="12" ry="17" class="soft"/>
    <path class="soft" d="M-28 38h56M-30 46h60M-26 54h52"/>
    <text class="label" x="0" y="88" text-anchor="middle">GLOBE</text>
    <circle class="port" cx="0" cy="100" r="2"/>
  </g>

  <g id="executive-dashboard" transform="translate(640 165)">
    <use href="#pane"/>
    <path class="line" d="M-36 62V44h12v18ZM-18 62V38h12v24ZM0 62V48h12v14ZM18 62V34h12v28Z"/>
    <text class="label" x="0" y="88" text-anchor="middle">DASHBOARD</text>
    <circle class="port" cx="0" cy="100" r="2"/>
  </g>

  <g id="research-insights" transform="translate(980 210)">
    <use href="#pane"/>
    <path class="line" d="m-28 36 22-12 36 20-22 12Z"/>
    <path class="soft" d="m-16 44 22-12 26 14-22 12Z"/>
    <path class="line" d="m-18 48 14-8M-12 54l14-8"/>
    <text class="label" x="0" y="88" text-anchor="middle">INSIGHTS</text>
    <circle class="port" cx="0" cy="100" r="2"/>
  </g>

  <g id="reporting-packs" transform="translate(1360 185)">
    <use href="#pane"/>
    <path class="line" d="m-26 38 18-10 32 18-18 10Z"/>
    <path class="soft" d="m-18 46 18-10 24 13-18 10Z"/>
    <path class="line" d="m-12 50 10-5M-6 56l10-5"/>
    <text class="label" x="0" y="88" text-anchor="middle">PACKS</text>
    <circle class="port" cx="0" cy="100" r="2"/>
  </g>
</svg>
