<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Phaeron Layer 08B — executive surfaces</title>
  <desc id="desc">Four executive tiles in the lower experience row: Market Globe, Executive Dashboard, Research &amp; Insights and Reporting Packs.</desc>
  <defs>
    <style>
      .edge{fill:#E7F0F5;stroke:#10283B;stroke-width:1.5;stroke-linejoin:round}
      .side{fill:#dce8ef;stroke:#10283B;stroke-width:1.25}
      .line{fill:none;stroke:#397DA8;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
      .soft{fill:none;stroke:#8FB8D0;stroke-width:.75}
      .faint{fill:#E7F0F5;stroke:#397DA8;stroke-width:.7}
      .blue{fill:#397DA8}
      .red{fill:#B4233C}
      .label{font:600 15px 'Open Sans',system-ui,sans-serif;letter-spacing:.01em;fill:#10283B}
      .micro{font:10px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.04em;fill:#62717e}
      .port{fill:#fff;stroke:#397DA8;stroke-width:1.5}
    </style>
    <symbol id="tile" overflow="visible">
      <path class="side" d="M-110 58 0 120 110 58v6L0 126-110 64Z"/>
      <path class="edge" d="M0 0 110 58 0 120-110 58Z"/>
    </symbol>
  </defs>

  <g id="market-globe" transform="translate(220 400)">
    <text class="label" x="0" y="-22" text-anchor="middle">Market Globe</text>
    <text class="micro" x="0" y="-6" text-anchor="middle">MARKETS · EVENTS</text>
    <use href="#tile"/>
    <ellipse cx="0" cy="66" rx="52" ry="30" class="line"/>
    <ellipse cx="0" cy="66" rx="20" ry="30" class="soft"/>
    <path class="soft" d="M-48 54h96M-50 68h100M0 36v60"/>
    <circle cx="24" cy="54" r="3.5" class="red"/>
    <circle class="port" cx="0" cy="0" r="3.5"/>
  </g>

  <g id="executive-dashboard" transform="translate(560 400)">
    <text class="label" x="0" y="-22" text-anchor="middle">Executive Dashboard</text>
    <text class="micro" x="0" y="-6" text-anchor="middle">KPI · EXPOSURE</text>
    <use href="#tile"/>
    <path class="line" d="M-64 80V54h24v26ZM-28 80V46h24v34ZM8 80V58h24v22ZM44 80V42h24v38Z"/>
    <circle cx="56" cy="46" r="3" class="red"/>
    <circle class="port" cx="0" cy="0" r="3.5"/>
  </g>

  <g id="research-insights" transform="translate(900 400)">
    <text class="label" x="0" y="-22" text-anchor="middle">Research &amp; Insights</text>
    <text class="micro" x="0" y="-6" text-anchor="middle">BRIEFING · EVIDENCE</text>
    <use href="#tile"/>
    <path class="line" d="m-46 44 36-20 62 34-36 20Z"/>
    <path class="faint" d="m-28 54 36-20 46 25-36 20Z"/>
    <path class="line" d="m-32 58 24-13M-24 68l24-13"/>
    <circle cx="44" cy="54" r="3" class="red"/>
    <circle class="port" cx="0" cy="0" r="3.5"/>
  </g>

  <g id="reporting-packs" transform="translate(1240 400)">
    <text class="label" x="0" y="-22" text-anchor="middle">Reporting Packs</text>
    <text class="micro" x="0" y="-6" text-anchor="middle">BOARD · CLIENT</text>
    <use href="#tile"/>
    <path class="edge" d="m-44 48 32-18 56 30-32 18Z"/>
    <path class="faint" d="m-34 58 32-18 46 25-32 18Z"/>
    <path class="line" d="m-26 62 18-10M-18 72l18-10"/>
    <path class="red" d="m36 72 6 3-6 4-6-3Z"/>
    <circle class="port" cx="0" cy="0" r="3.5"/>
  </g>
</svg>
