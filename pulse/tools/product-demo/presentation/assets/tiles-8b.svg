<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Phaeron Layer 08B — executive surfaces</title>
  <desc id="desc">Four executive tiles on an upper irregular band, clear of Layer 08.</desc>
  <defs>
    <style>
      .edge{fill:#fff;stroke:#0b3d66;stroke-width:1;stroke-linejoin:round}
      .side{fill:#f4f7fa;stroke:#6d8eab;stroke-width:.85}
      .line{fill:none;stroke:#0b3d66;stroke-width:.9;stroke-linecap:round;stroke-linejoin:round}
      .soft{fill:none;stroke:#6d8eab;stroke-width:.75}
      .faint{fill:#d6e0ea;stroke:#6d8eab;stroke-width:.7}
      .blue{fill:#0b3d66;fill-opacity:.55}
      .label{font:600 16px 'Open Sans',system-ui,sans-serif;letter-spacing:.02em;fill:#0a1c2e}
      .micro{font:10px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.04em;fill:#5a6a78}
      .port{fill:#0b3d66;fill-opacity:.3;stroke:none}
    </style>
    <symbol id="tile" overflow="visible">
      <path class="side" d="M-120 64 0 132 120 64v6L0 138-120 70Z"/>
      <path class="edge" d="M0 0 120 64 0 132-120 64Z"/>
      <path class="soft" d="M-104 64 0 12 104 64 0 120Z"/>
    </symbol>
  </defs>

  <!-- Upper band raised clear of Layer 08 — ports at (0,132) -->
  <g id="market-globe" transform="translate(220 140)">
    <text class="label" x="0" y="-22" text-anchor="middle">Market Globe</text>
    <text class="micro" x="0" y="-6" text-anchor="middle">MARKETS · EVENTS</text>
    <use href="#tile"/>
    <ellipse cx="0" cy="68" rx="54" ry="30" class="line"/>
    <ellipse cx="0" cy="68" rx="20" ry="30" class="soft"/>
    <path class="soft" d="M-50 56h100M-52 70h104M0 38v60"/>
    <circle cx="24" cy="56" r="2.5" class="blue"/>
    <circle class="port" cx="0" cy="132" r="2"/>
  </g>

  <g id="executive-dashboard" transform="translate(640 110)">
    <text class="label" x="0" y="-22" text-anchor="middle">Executive Dashboard</text>
    <text class="micro" x="0" y="-6" text-anchor="middle">KPI · EXPOSURE</text>
    <use href="#tile"/>
    <path class="line" d="M-60 78V52h22v26ZM-28 78V44h22v34ZM4 78V56h22v22ZM36 78V40h22v38Z"/>
    <circle cx="50" cy="44" r="2.5" class="blue"/>
    <circle class="port" cx="0" cy="132" r="2"/>
  </g>

  <g id="research-insights" transform="translate(980 155)">
    <text class="label" x="0" y="-22" text-anchor="middle">Research &amp; Insights</text>
    <text class="micro" x="0" y="-6" text-anchor="middle">BRIEFING · EVIDENCE</text>
    <use href="#tile"/>
    <path class="line" d="m-46 48 34-18 58 32-34 18Z"/>
    <path class="faint" d="m-28 58 34-18 44 24-34 18Z"/>
    <path class="line" d="m-32 62 22-12M-24 72l22-12"/>
    <circle cx="42" cy="56" r="2.5" class="blue"/>
    <circle class="port" cx="0" cy="132" r="2"/>
  </g>

  <g id="reporting-packs" transform="translate(1360 130)">
    <text class="label" x="0" y="-22" text-anchor="middle">Reporting Packs</text>
    <text class="micro" x="0" y="-6" text-anchor="middle">BOARD · CLIENT</text>
    <use href="#tile"/>
    <path class="edge" d="m-42 50 30-16 52 28-30 16Z"/>
    <path class="faint" d="m-32 60 30-16 42 23-30 16Z"/>
    <path class="line" d="m-24 64 16-9M-16 74l16-9"/>
    <circle class="port" cx="0" cy="132" r="2"/>
  </g>
</svg>
