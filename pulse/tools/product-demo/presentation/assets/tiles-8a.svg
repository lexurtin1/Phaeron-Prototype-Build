<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Phaeron Layer 08A — front-end system tiles</title>
  <desc id="desc">Four application tiles in the upper experience row: Commercial Analytics, Client Intelligence, Opportunity Radar and Service Operations.</desc>
  <defs>
    <style>
      .edge{fill:#E7F0F5;stroke:#10283B;stroke-width:1.5;stroke-linejoin:round}
      .side{fill:#dce8ef;stroke:#10283B;stroke-width:1.25}
      .line{fill:none;stroke:#397DA8;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
      .soft{fill:none;stroke:#8FB8D0;stroke-width:.75}
      .faint{fill:#E7F0F5;stroke:#397DA8;stroke-width:.7}
      .blue{fill:#397DA8}
      .red{fill:#B4233C}
      .label{font:600 15px 'Open Sans',system-ui,sans-serif;letter-spacing:.01em;fill:#10283B}
      .micro{font:10px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.04em;fill:#62717e}
      .port{fill:#fff;stroke:#397DA8;stroke-width:1.5}
    </style>
    <symbol id="tile" overflow="visible">
      <path class="side" d="M-110 58 0 120 110 58v6L0 126-110 64Z"/>
      <path class="edge" d="M0 0 110 58 0 120-110 58Z"/>
    </symbol>
  </defs>

  <g id="commercial-analytics" transform="translate(220 150)">
    <text class="label" x="0" y="-22" text-anchor="middle">Commercial Analytics</text>
    <text class="micro" x="0" y="-6" text-anchor="middle">PIPELINE · REVENUE</text>
    <use href="#tile"/>
    <path class="line" d="m-64 70 16-9 11 5 14-8 12 7 16-9 10 5"/>
    <circle cx="24" cy="66" r="3.5" class="red"/>
    <circle class="port" cx="0" cy="126" r="3.5"/>
  </g>

  <g id="client-intelligence" transform="translate(560 150)">
    <text class="label" x="0" y="-22" text-anchor="middle">Client Intelligence</text>
    <text class="micro" x="0" y="-6" text-anchor="middle">PROFILE · HISTORY</text>
    <use href="#tile"/>
    <circle cx="-18" cy="64" r="14" class="edge"/>
    <circle cx="-18" cy="60" r="4.5" class="faint"/>
    <path class="line" d="M-28 74q10-10 20 0"/>
    <path class="line" d="M8 50 64 88"/>
    <circle cx="56" cy="82" r="3" class="blue"/>
    <circle class="port" cx="0" cy="126" r="3.5"/>
  </g>

  <g id="opportunity-radar" transform="translate(900 150)">
    <text class="label" x="0" y="-22" text-anchor="middle">Opportunity Radar</text>
    <text class="micro" x="0" y="-6" text-anchor="middle">SIGNALS · PRIORITY</text>
    <use href="#tile"/>
    <ellipse cx="0" cy="66" rx="56" ry="30" class="soft"/>
    <ellipse cx="0" cy="66" rx="36" ry="20" class="soft"/>
    <ellipse cx="0" cy="66" rx="16" ry="9" class="soft"/>
    <path class="line" d="M-56 66h112M0 36v60"/>
    <circle cx="30" cy="52" r="4" class="red"/>
    <circle class="port" cx="0" cy="126" r="3.5"/>
  </g>

  <g id="service-operations" transform="translate(1240 150)">
    <text class="label" x="0" y="-22" text-anchor="middle">Service Operations</text>
    <text class="micro" x="0" y="-6" text-anchor="middle">WORKFLOW · EXCEPTIONS</text>
    <use href="#tile"/>
    <path class="line" d="m-66 48 28 15-14 9-28-16Z"/>
    <path class="line" d="m-26 68 28 15-14 9-28-16Z"/>
    <path class="line" d="m14 48 28 15-14 9-28-16Z"/>
    <circle cx="16" cy="58" r="3" class="red"/>
    <circle class="port" cx="0" cy="126" r="3.5"/>
  </g>
</svg>
