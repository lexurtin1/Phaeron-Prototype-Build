<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Phaeron Layer 08A — front-end system tiles</title>
  <desc id="desc">Four flat isometric application panes: Commercial Analytics, Client Intelligence, Opportunity Radar, and Service Operations.</desc>
  <defs>
    <style>
      .pane{fill:#fff;fill-opacity:.92;stroke:#087fd0;stroke-width:.95;stroke-linejoin:round}
      .line{fill:none;stroke:#087fd0;stroke-width:.85;stroke-linecap:round;stroke-linejoin:round}
      .soft{fill:none;stroke:#8fc8ef;stroke-width:.7;stroke-linecap:round;stroke-linejoin:round}
      .label{font:600 11px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;fill:#102538}
      .port{fill:#087fd0;fill-opacity:.35;stroke:none}
    </style>
    <symbol id="pane" overflow="visible">
      <path class="pane" d="M0 0 92 50 0 100 -92 50Z"/>
    </symbol>
  </defs>

  <!-- Lower band — port at (0,100) relative to translate -->
  <g id="commercial-analytics" transform="translate(380 410)">
    <use href="#pane"/>
    <path class="soft" d="M-48 42h36M-42 50h48M-36 58h28"/>
    <path class="line" d="m-8 68 10-5 8 4 12-6 9 5"/>
    <text class="label" x="0" y="88" text-anchor="middle">ANALYTICS</text>
    <circle class="port" cx="0" cy="100" r="2"/>
  </g>

  <g id="client-intelligence" transform="translate(720 455)">
    <use href="#pane"/>
    <circle cx="-28" cy="48" r="11" class="line"/>
    <circle cx="-28" cy="45" r="3.5" class="soft"/>
    <path class="line" d="M-36 56q8-8 16 0"/>
    <path class="soft" d="M-6 40h42M-2 48h34M4 56h22"/>
    <text class="label" x="0" y="88" text-anchor="middle">CLIENT</text>
    <circle class="port" cx="0" cy="100" r="2"/>
  </g>

  <g id="opportunity-radar" transform="translate(1120 390)">
    <use href="#pane"/>
    <ellipse cx="0" cy="48" rx="36" ry="20" class="soft"/>
    <ellipse cx="0" cy="48" rx="22" ry="12" class="soft"/>
    <ellipse cx="0" cy="48" rx="8" ry="4.5" class="line"/>
    <path class="line" d="M-36 48h72M0 28v40"/>
    <text class="label" x="0" y="88" text-anchor="middle">RADAR</text>
    <circle class="port" cx="0" cy="100" r="2"/>
  </g>

  <g id="service-operations" transform="translate(1420 440)">
    <use href="#pane"/>
    <path class="line" d="m-40 40 18 10-10 6-18-10Z"/>
    <path class="soft" d="m-14 52 18 10-10 6-18-10Z"/>
    <path class="line" d="m12 40 18 10-10 6-18-10Z"/>
    <text class="label" x="0" y="88" text-anchor="middle">OPS</text>
    <circle class="port" cx="0" cy="100" r="2"/>
  </g>
</svg>
