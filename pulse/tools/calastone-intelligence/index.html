<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calastone · Calastone Intelligence</title>
<link rel="stylesheet" href="../../design-system/tokens/colors.css">
<link rel="stylesheet" href="../../design-system/tokens/typography.css">
<link rel="stylesheet" href="../../design-system/tokens/spacing.css">
<link rel="stylesheet" href="../../design-system/tokens/effects.css">
<link rel="stylesheet" href="../../design-system/base.css">
<style>
  body { margin: 0; background: var(--color-bg-subtle); font-family: var(--font-sans); color: var(--text-primary); }
  .topbar { display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-5);height:56px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(226,232,238,0.85);box-shadow:0 1px 0 rgba(255,255,255,0.7),0 4px 20px -8px rgba(15,34,48,.06); }
  .home-btn { display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text-secondary);padding:7px 13px;border-radius:8px;background:var(--color-bg-subtle);border:1px solid var(--border-subtle);cursor:pointer;text-decoration:none;box-shadow:var(--shadow-xs);white-space:nowrap; }
  .home-btn svg { width:14px;height:14px;stroke:currentColor;flex-shrink:0; }
  .home-btn:hover { border-color:var(--teal-500);color:var(--text-strong); }
  .brand { display:flex;flex-direction:column;line-height:1.05; }
  .logo-text { font-size:14px;font-weight:300;letter-spacing:.12em;text-transform:uppercase; }
  .gradline { height:3px;border-radius:3px;background:linear-gradient(90deg,#007DB7,var(--teal-500),#6AAD6A);margin-top:5px; }
  .topbar-divider { width:1px;height:22px;background:var(--border-subtle); }
  .page-title { font-size:12px;font-weight:500;color:var(--text-secondary); }
  .spacer { flex:1; }
  .hero { display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 56px);gap:var(--space-5);text-align:center;padding:var(--space-10); }
  .badge { display:inline-flex;align-items:center;gap:var(--space-2);padding:5px 14px;border-radius:999px;background:rgba(45,154,142,0.08);border:1px solid rgba(45,154,142,0.2);color:var(--teal-600);font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase; }
  .badge-dot { width:7px;height:7px;border-radius:50%;background:var(--teal-500); }
  h1 { font-size:48px;font-weight:800;letter-spacing:-0.02em;color:var(--text-strong);margin:0; }
  .desc { font-size:17px;color:var(--text-secondary);max-width:480px;line-height:1.6;margin:0; }
</style>
</head>
<body>
<div class="topbar">
  <a href="../../index.html" class="home-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    &#8592; Pulse Home
  </a>
  <div class="topbar-divider"></div>
  <div class="brand">
    <div class="logo-text">Calastone</div>
    <div class="gradline"></div>
  </div>
  <span class="page-title">Calastone Intelligence</span>
  <div class="spacer"></div>
</div>
<div class="hero">
  <div class="badge"><span class="badge-dot"></span>Coming Soon</div>
  <h1>Calastone Intelligence</h1>
  <p class="desc">AI-driven market and network analytics</p>
  <a href="../../index.html" class="home-btn" style="margin-top:var(--space-4)">&#8592; Back to Pulse</a>
</div>
</body>
</html>
