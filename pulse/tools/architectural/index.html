<html lang="en-GB">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  three-d-stage:not(:defined){visibility:hidden}
  :root{--chrome-stack:132px;--ink:#0c1a2e;--muted:#3d4f66;--blue:#008cff;--line:#dde4ee;--crimson:#9f1239;--sans:"Open Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);overflow:hidden;font-synthesis:none}
  a{color:var(--ink);text-decoration:none}a:hover{color:var(--blue)}
  button{font:inherit;color:inherit}
  .header{height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 3.3vw;border-bottom:1px solid var(--line)}
  body.has-studio-chrome .header{display:none}
  body.has-studio-chrome{--chrome-stack:132px}
  .brand{font-size:17px;font-weight:700;letter-spacing:3px;display:flex;align-items:center;gap:12px}
  .brand svg{width:22px;height:22px;color:var(--blue)}
  .header-note,.header-count{white-space:nowrap;font:12px var(--mono);letter-spacing:.055em;color:var(--muted)}
  .header-count{color:var(--blue)}
  .story{display:grid;grid-template-columns:minmax(320px,32%) minmax(0,1fr);height:calc(100vh - var(--chrome-stack, 132px));padding:0 3.3vw}
  .chapters{display:flex;align-items:center;min-width:0;padding:32px 24px 32px 0;overflow:auto}
  #copy{max-width:470px;transition:opacity 160ms cubic-bezier(.2,0,.2,1),transform 160ms cubic-bezier(.2,0,.2,1)}
  #copy.swap{opacity:0;transform:translateY(6px)}
  .eyebrow{font:600 11px/1.5 var(--mono);letter-spacing:.035em;margin:0 0 24px;color:var(--muted)}
  #copy h1{font-size:clamp(40px,4.6vw,80px);line-height:1.045;font-weight:400;letter-spacing:-.055em;margin:0 0 26px;text-wrap:balance}
  #copy h1 em{font-style:normal;color:var(--acc)}
  .description{font-size:clamp(16px,1.3vw,21px);line-height:1.55;max-width:420px;color:var(--muted);margin:0 0 20px;text-wrap:pretty}
  .points{list-style:none;margin:0 0 28px;padding:0;max-width:420px;display:flex;flex-direction:column;gap:8px}
  .points li{position:relative;padding-left:14px;font:500 13px/1.45 var(--mono);letter-spacing:.02em;color:var(--muted)}
  .points li:before{content:"";position:absolute;left:0;top:.55em;width:5px;height:5px;border-radius:50%;background:var(--acc,#008cff)}
  .parts-label{font:600 11px/1.4 var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:0 0 10px}
  .parts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px;max-width:440px}
  .parts button{white-space:nowrap;background:#fff;border:1px solid var(--line);padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:border-color 120ms,color 120ms}
  .parts button:hover{border-color:var(--acc);color:var(--acc)}
  .parts button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .detail{margin:0 0 24px;max-width:420px;border-left:2px solid var(--acc);padding-left:12px}
  .detail span{display:block;font:600 11px/1.4 var(--mono);letter-spacing:.06em;color:var(--muted);margin:0 0 4px;text-transform:uppercase}
  .detail p{margin:0;font-size:16px;line-height:1.5;color:var(--ink);font-weight:600}
  .detail .detail-blurb{margin-top:6px;font-size:14px;line-height:1.5;font-weight:400;color:var(--muted)}
  .detail .mc{font:400 11px var(--mono);letter-spacing:.04em;color:var(--muted);font-style:normal;margin-left:6px}
  .explore{white-space:nowrap;display:inline-flex;align-items:center;gap:18px;font-size:15px;font-weight:600;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
  .explore span{color:var(--crimson);height:40px;width:30px;display:grid;place-items:center;border:1px solid var(--line);transition:border-color 120ms}
  .explore:hover span{border-color:var(--crimson)}
  .stage{display:flex;flex-direction:column;min-width:0;padding:14px 0 12px 5px}
  .stage-top{white-space:nowrap;display:flex;justify-content:space-between;align-items:center;padding:0 6px 0 18px;font:12px var(--mono);letter-spacing:.05em;color:var(--muted)}
  #reset{font:12px var(--mono);color:var(--muted);background:none;border:0;cursor:pointer;padding:6px 0;letter-spacing:.05em}
  #reset:hover{color:var(--ink)}#reset:disabled{opacity:0;pointer-events:none}
  .art{position:relative;flex:1;min-height:320px}
  three-d-stage{position:absolute;inset:0;width:100%;height:100%;--stage-bg:#ffffff}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .cross{position:absolute;width:11px;height:11px;opacity:.5;pointer-events:none}
  .cross:before,.cross:after{content:"";position:absolute;background:#a8bacb}
  .cross:before{width:11px;height:1px;top:5px}.cross:after{width:1px;height:11px;left:5px}
  .cross-a{right:3%;top:6%}.cross-b{left:3%;bottom:6%}
  .lbl{position:absolute;left:0;top:0;white-space:nowrap;display:flex;flex-direction:column;align-items:center;transition:opacity 180ms}
  .lbl .n{font-size:14px;font-weight:600;color:var(--ink);padding:1px 5px;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
  .lbl-tile{display:none}.lbl-tile.open,.lbl-tile.hov{display:flex}
  .lbl-tile .n{font-size:12px}
  .lbl .m{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:#62717e;padding:0 4px;text-shadow:0 0 3px #fff,0 0 3px #fff}
  .lbl-tile .m{display:none}.lbl-tile.open .m{display:block}
  .lbl-micro .n{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;color:#0a6fd6}
  .lbl.on .n{color:#fff;background:#0a6fd6;text-shadow:none}
  .callout{position:absolute;left:0;top:0;display:flex;align-items:center;background:none;border:0;padding:0;cursor:pointer;pointer-events:auto;transition:opacity 220ms;color:var(--acc)}
  .callout .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none;margin:0 -3px}
  .callout .rule{width:64px;height:1px;background:var(--acc);flex:none}
  .callout .ct{display:flex;flex-direction:column;gap:4px;padding:0 10px;text-align:left}
  .callout .t{font-size:14.5px;font-weight:600;line-height:1.28;letter-spacing:.1px;text-transform:uppercase;white-space:nowrap}
  .callout .w{font:400 10px var(--mono);letter-spacing:.05em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
  .callout.right{transform-origin:left center}
  .callout.left{flex-direction:row-reverse;translate:-100% 0}
  .callout.left .ct{text-align:right;align-items:flex-end}
  .callout.right{translate:0 0}
  .callout .ct,.callout .dot,.callout .rule{translate:0 -50%}
  .callout{height:0}
  .callout.on .t{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
  .stage-caption{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;padding:6px 6px 14px 18px}
  #caption-index{font:600 12px var(--mono);letter-spacing:.06em}
  #caption-title{font-size:24px;line-height:1.2;font-weight:600;letter-spacing:-.025em;margin:8px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stage-caption>div{min-width:0}
  #caption-state{font:11px var(--mono);color:var(--muted);white-space:nowrap}
  #nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-left:18px}
  #nav button{display:flex;flex-direction:column;gap:6px;padding:12px 4px 0;border:0;border-top:1px solid var(--line);position:relative;color:var(--muted);min-height:54px;background:none;cursor:pointer;text-align:left}
  #nav button:before{content:"";position:absolute;inset:-1px 0 auto;height:2px;background:var(--layer-color);transform:scaleX(0);transform-origin:left;transition:transform .2s}
  #nav button[aria-current]:before{transform:scaleX(1)}
  #nav button:hover,#nav button[aria-current]{color:var(--layer-color)}
  .nav-index{font:12px var(--mono)}
  .nav-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:1100px){.callout .rule{width:34px}.callout .t{font-size:12px}.callout .w{font-size:9px}.lbl .n{font-size:12px}}
  @media(max-height:700px){.stage-caption{padding-bottom:8px}#caption-title{font-size:18px;margin-top:4px}#nav button{min-height:44px;padding-top:8px}.chapters{align-items:flex-start}}
  @media(max-width:1180px){.header-note{display:none}#caption-state{display:none}#caption-title{font-size:20px}.nav-name{font-size:12px}}
</style>
</head>
<body class="has-studio-chrome">
<div id="pulse-react-chrome" data-title="Studio" data-module="studio" data-view="primary"></div>
<script src="/ui/islands/load-chrome.js"></script>
<header class="header">
  <a class="brand" href="#" aria-label="Phaeron"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 10l11-6 11 6-11 6zM5 16l11 6 11-6M5 22l11 6 11-6" fill="none" stroke="currentColor" stroke-width="1.7"></path></svg>PHAERON</a>
  <span class="header-note">BUSINESS CONTEXT / FINANCIAL SERVICES</span>
  <span class="header-count">SIX LAYERS. ONE SYSTEM.</span>
</header>
<main class="story">
  <div class="chapters"><div id="copy" aria-live="polite"></div></div>
  <section class="stage" aria-label="Phaeron system view">
    <div class="stage-top"><span>PHAERON / SYSTEM VIEW</span><button type="button" id="reset">RESET VIEW ↺</button></div>
    <div class="art">
      <three-d-stage name="phaeron-architecture" no-toolbar no-note background="#ffffff"></three-d-stage>
      <span class="cross cross-a" aria-hidden="true"></span><span class="cross cross-b" aria-hidden="true"></span>
      <div id="labels"></div>
    </div>
    <div class="stage-caption"><div><span id="caption-index">00 / 06</span><h3 id="caption-title">Information, everywhere.</h3></div><span id="caption-state">ASSEMBLED</span></div>
    <nav id="nav" aria-label="Layers"></nav>
  </section>
</main>
<script src="three-d-stage.js"></script>
<script type="module" src="arch-app-v2.js"></script>
</body>
</html>
