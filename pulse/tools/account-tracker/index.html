<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phaeron · Opportunities</title>
<link rel="stylesheet" href="../../design-system/tokens/colors.css">
<link rel="stylesheet" href="../../design-system/tokens/typography.css">
<link rel="stylesheet" href="../../design-system/tokens/spacing.css">
<link rel="stylesheet" href="../../design-system/tokens/effects.css">
<link rel="stylesheet" href="../../design-system/base.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="pulse-react-chrome" data-title="Opportunities"></div>
<script src="/ui/islands/load-chrome.js"></script>

<div class="layout">
  <div class="left" id="leftPanel">
    <div class="left-head">
      <div class="left-search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input placeholder="Filter accounts…" id="filterInput">
      </div>
      <div class="chips" id="chips">
        <div class="chip active" data-f="all">All <span class="cnt">4</span></div>
        <div class="chip" data-f="news">News <span class="cnt">4</span></div>
        <div class="chip" data-f="sf">Salesforce <span class="cnt">4</span></div>
        <div class="chip" data-f="nocontact">No Contact <span class="cnt">1</span></div>
      </div>
    </div>
    <div class="list-meta">
      <span>Accounts · 4 clients</span>
      <span class="sort">Signal urgency <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </div>
    <div class="plist" id="plist"></div>
  </div>

  <div class="right" id="rightPanel">
    <div class="mobile-back" id="mobileBack">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg> Back to accounts
    </div>
    <div class="detail" id="detail"></div>
  </div>
</div>

<script src="./app.js"></script>
<script src="../../favicon-pulse.js"></script>
</body>
</html>
